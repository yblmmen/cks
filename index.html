/* GitHub 스타일: 왼쪽 도메인 6개를 하나의 아코디언으로 구성 */
.domain-accordion{display:flex;flex-direction:column;gap:5px;margin:4px 0 15px}
.domain-group{min-width:0}
.domain-tab{display:flex;align-items:center;gap:9px;width:100%;min-height:58px;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);text-align:left;transition:background .15s,border-color .15s,box-shadow .15s}
.domain-tab:hover{background:var(--panel2);border-color:var(--border)}
.domain-tab[aria-expanded="true"]{background:var(--teal-light);border-color:rgba(13,148,136,.26);color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.domain-tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.domain-tab-arrow{font-size:11px;flex:0 0 9px;color:var(--muted);transition:transform .15s}
.domain-tab[aria-expanded="true"] .domain-tab-arrow{transform:rotate(90deg);color:var(--teal)}
.domain-tab-badge{display:grid;place-items:center;flex:0 0 27px;width:27px;height:27px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);font-size:11px;font-weight:800}
.domain-tab[aria-expanded="true"] .domain-tab-badge{border-color:rgba(13,148,136,.3);background:var(--panel);color:var(--teal)}
.domain-tab-label{display:flex;flex:1;min-width:0;flex-direction:column;line-height:1.4}
.domain-tab-label strong{font-size:12.5px;font-weight:800}
.domain-tab-label small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.domain-tab-counter{flex-shrink:0;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:2px 6px;font-size:10px;font-weight:700}
.domain-children{margin:4px 3px 9px 20px;border-left:2px solid var(--border);padding:4px 0 4px 9px}
.domain-children[hidden]{display:none}
.domain-subtitle{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.6px;padding:7px 8px 4px}
.domain-children .nav-item{padding:8px 8px;font-size:11.5px;align-items:flex-start}
.domain-children .nav-item .num{padding-top:1px}
.domain-children .nav-item span:last-child{min-width:0;overflow-wrap:anywhere}
.domain-source{margin:8px 0 0;border-top:1px solid var(--border)}
.domain-source>summary{display:flex;align-items:center;gap:7px;list-style:none;cursor:pointer;font-size:11.5px;font-weight:750;color:var(--muted);padding:9px 7px}
.domain-source>summary::-webkit-details-marker{display:none}
.domain-source>summary:before{content:'▸';font-size:10px;transition:transform .15s}
.domain-source[open]>summary:before{transform:rotate(90deg)}
.domain-source>summary:hover{color:var(--teal)}
.domain-source .source-file{font-size:11px;padding:6px 5px}
.domain-source .tree-folder{margin-left:7px}
.domain-source .tree-folder .source-file{padding-left:14px}
.domain-source .source-domain summary{font-size:11px}
.sidebar-hint{margin-top:16px}

function renderLesson(l){const d=DOMAINS[l.domain-1];const labs=LESSONS.filter(x=>x.domain===l.domain),index=labs.indexOf(l);return `${crumb(['Domain '+d.id,d.title,l.title])}<div class="page-head"><div><span class="pill">Domain ${d.id} · ${d.weight}%</span><h1>${escapeHtml(l.title)}</h1><p>${escapeHtml(l.desc)}</p></div><div class="page-actions"><button class="btn ${completed[l.id]?'teal':''}" data-done="${escapeAttr(l.id)}">${completed[l.id]?'✓ 학습 완료':'□ 완료 표시'}</button><button class="btn" data-print>⎙ 인쇄</button></div></div><div class="lesson-layout"><div class="reading"><div class="content-card"><h2>01 · 실습 목표</h2><p>${escapeHtml(l.goal)}</p><div class="callout">운영환경이 아닌 별도 Kubernetes 테스트 클러스터에서 수행하십시오. 모든 예시는 클러스터 버전·CNI·OS·런타임 환경에 따라 조정이 필요합니다.</div></div><div class="content-card"><h2>02 · 명령어 및 매니페스트</h2><p>설명용 예시입니다. 일부 예시는 CLI 명령과 YAML 구문을 같이 포함하므로 파일을 구분하여 실행해야 합니다.</p>${codeBox(l.cmd)}</div><div class="content-card"><h2>03 · 검증 및 결과 확인</h2><p>명령 실행 후 리소스 상태와 권한·접근 동작을 비교합니다.</p>${codeBox(l.check,'검증 명령')}</div><div class="content-card"><h2>04 · 유의사항 / 장애 예방</h2><div class="callout warning">${escapeHtml(l.tip)}</div><h3>참고 문서</h3><a class="small-link" href="${escapeAttr(safeUrl(l.docs))}" target="_blank" rel="noopener noreferrer">공식 문서·도구 프로젝트 열기 ↗</a><a class="small-link" href="${REPO_URL}/tree/main/${encodePath(d.dir)}" target="_blank" rel="noopener noreferrer">GitHub 원본 Domain ${d.id} 폴더 ↗</a></div><div class="page-actions" style="justify-content:space-between;margin-top:18px"><button class="btn" ${index===0?'disabled':''} data-go="lesson:${labs[Math.max(0,index-1)].id}">← 이전 실습</button><button class="btn teal" data-go="lesson:${labs[Math.min(labs.length-1,index+1)].id}">${index===labs.length-1?'마지막 실습':'다음 실습 →'}</button></div></div><div class="side-info"><div class="content-card"><h3>학습 진행</h3><p>Domain ${d.id} · ${index+1}/${labs.length}</p><div class="progress-line"><span style="width:${countDone(d.id)/labs.length*100}%"></span></div><p style="margi function renderSearch(){let q=query.toLowerCase(),found=LESSONS.filter(l=>matchLesson(l,q)),files=matchingFiles(q);return `${crumb(['검색'])}<div class="page-head"><div><span class="pill">통합 검색</span><h1>“${escapeHtml(query)}” 검색 결과</h1><p>한국어 실습 노트 내용과 온라인으로 불러온 GitHub 파일 경로를 함께 탐색합니다.</p></div><button class="btn" data-clear>검색 지우기</button></div><div class="section-title"><div><h2>한국어 실습 노트 <span class="muted">${found.length}</span></h2></div></div>${found.length?found.map(l=>`<button class="result-card" data-go="lesson:${l.id}"><small>Domain ${l.domain} · 실습</small><strong>${escapeHtml(l.title)}</strong><small>${escapeHtml(l.desc)}</small></button>`).join(''):'<div class="empty-state">해당 키워드의 학습 노트가 없습니다.</div>'}<div class="section-title"><div><h2>GitHub 원본 파일 <span class="muted">${files.length}</span></h2><p>${repoState==='ready'?'현재 동기화된 파일 이름을 검색합니다.':'온라인 연결 후 원본 파일명도 검색할 수 있습니다.'}</p></div></div>${files.length?files.slice(0,180).map(f=>`<button class="result-card" data-go="file:${escapeAttr(f.path)}"><small>GitHub 원본 파일</small><strong>${fileIcon(f.path)} ${escapeHtml(f.path.split('/').at(-1))}</strong><small>${escapeHtml(f.path)}</small></button>`).join(''):'<div class="empty-state">일치하는 원본 파일이 없거나 GitHub 동기화가 필요합니다.</div>'}`}
function inlineMd(s){let x=escapeHtml(s);x=x.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,a,u)=>`<em>[이미지: ${escapeHtml(a)}] <a href="${escapeAttr(resolveMdUrl(u))}" target="_blank" rel="noopener">원본 열기</a></em>`);x=x.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,a,u)=>`<a href="${escapeAttr(resolveMdUrl(u))}" target="_blank" rel="noopener noreferrer">${a}</a>`);x=x.replace(/`([^`]+)`/g,'<code>$1</code>');x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');x=x.replace(/\*([^*]+)\*/g,'<em>$1</em>');return x}
let currentMdPath='';function resolveMdUrl(u){u=u.replace(/&amp;/g,'&');if(/^https?:\/\//i.test(u))return u;if(u.startsWith('#'))return u;let base=currentMdPath.split('/').slice(0,-1).join('/');let parts=(base+'/'+u).split('/'),stack=[];for(const p of parts){if(p==='..')stack.pop();else if(p&&p!=='.')stack.push(p)}return sourceUrl(stack.join('/'))}
function renderMarkdown(md,path){currentMdPath=path;const lines=md.replace(/\r\n?/g,'\n').split('\n');const out=[];let code=[],fence=false,lang='',listType='',paragraph=[],table=[];const flushP=()=>{if(paragraph.length){out.push('<p>'+inlineMd(paragraph.join(' '))+'</p>');paragraph=[]}};const closeList=()=>{if(listType){out.push(`</${listType}>`);listType=''}};const flushTable=()=>{if(table.length){out.push('<div style="overflow-x:auto"><table>'+table.map((r,i)=>'<tr>'+r.map(c=>`<${i===0?'th':'td'}>${inlineMd(c.trim())}</${i===0?'th':'td'}>`).join('')+'</tr>').join('')+'</table></div>');table=[]}};
 for(let i=0;i<lines.length;i++){let ln=lines[i],fm=ln.match(/^\s*(```+|~~~+)(\w*)/);if(fm){flushP();closeList();flushTable();if(!fence){fence=true;lang=fm[2]||'';code=[]}else{out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);fence=false}continue}if(fence){code.push(ln);continue}if(/^\s*$/.test(ln)){flushP();closeList();flushTable();continue}if(/^\|/.test(ln)&&ln.endsWith('|')){flushP();closeList();let cs=ln.split('|').slice(1,-1);if(cs.every(c=>/^\s*:?-+:?\s*$/.test(c)))continue;table.push(cs);continue}else flushTable();const h=ln.match(/^(#{1,6})\s+(.+)$/);if(h){flushP();closeList();let n=Math.min(h[1].length+1,6);out.push(`<h${n}>${inlineMd(h[2])}</h${n}>`);continue}if(/^\s*---+\s*$/.test(ln)){flushP();closeList();out.push('<hr>');continue}if(/^\s*>\s?/.test(ln)){flushP();closeList();out.push(`<blockquote>${inlineMd(ln.replace(/^\s*>\s?/,''))}</blockquote>`);continue}let bullet=ln.match(/^\s*([-*+]\s+|\d+\.\s+)(.+)$/);if(bullet){flushP();let t=/\d/.test(bullet[1][0])?'ol':'ul';if(listType!==t){closeList();out.push('<'+t+'>');listType=t}out.push('<li>'+inlineMd(bullet[2])+'</li>');continue}closeList();paragraph.push(ln.trim())}flushP();closeList();flushTable();if(fence)out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);return out.join('\n')}
async function showFile(path){const host=$('fileBody');if(!host)return;host.innerHTML='<div class="empty-state"><span>◌</span><b>원본 파일을 불러오는 중...</b><span>GitHub Raw 문서 요청</span></div>';
 if(repoRawCache.has(path)){fillFile(path,repoRawCache.get(path));return}if(repoSource==='local'){host.innerHTML='<div class="empty-state"><b>선택한 폴더에 해당 파일 내용이 없습니다.</b><p>로컬 원본 폴더를 다시 불러오십시오.</p></div>';return}if(activeRepoController)activeRepoController.abort();let controller=new AbortController();activeRepoController=controller;try{let res=await fetch(RAW+encodePath(path),{signal:controller.signal});if(!res.ok)throw new Error('HTTP '+res.status);if(res.headers.get('content-length')&&Number(res.headers.get('content-length'))>2500000)throw new Error('2.5MB 초과 파일');let data=await res.text();if(data.length>2500000)throw new Error('2.5MB 초과 파일');repoRawCache.set(path,data);if(current==='file:'+path)fillFile(path,data)}catch(e){if(e.name==='AbortError')return;if(current==='file:'+path)host.innerHTML=`<div class="empty-state"><b>파일 내용을 불러올 수 없습니다.</b><p>${escapeHtml(e.message)} · 네트워크 / CORS / GitHub 접근 설정을 확인하십시오.</p><a href="${sourceUrl(path)}" target="_blank" rel="noopener" class="btn">GitHub에서 직접 열기 ↗</a></div>`}}
function fillFile(path,data){const host=$('fileBody');if(!host)return;const isMd=/\.md$/i.test(path);host.innerHTML=renderRaw||!isMd?codeBox(data,'원본 '+path.split('/').at(-1)):`<article class="markdown-body">${renderMarkdown(data,path)}</article>`;wireActions(host)}
function renderFile(path){const isMd=/\.md$/i.test(path),filename=path.split('/').at(-1);return `${crumb(['GitHub 원본',filename])}<div class="page-head"><div><span class="pill">${repoSource==='local'?'로컬 저장소 원문':'GitHub 원문 · main 브랜치'}</span><h1>${escapeHtml(filename)}</h1><p class="file-meta">${escapeHtml(path)}</p></div><div class="page-actions"><a class="btn" target="_blank" rel="noopener noreferrer" href="${sourceUrl(path)}">GitHub에서 열기 ↗</a><button class="btn" data-filecopy>전체 복사</button></div></div><div class="source-view"><div class="source-summary">원본 저작자: Zeal Vora / Contributors · ${repoSource==='local'?'사용자가 선택한 로컬 저장소 파일을 읽고 있습니다.':'GitHub 저장소에서 실시간으로 가져오는 내용입니다.'} 이 포털의 한국어 학습 노트와 별개입니다.</div><div class="source-code-toggle"><button class="tab ${!renderRaw?'active':''}" data-mode="render">문서 보기</button><button class="tab ${renderRaw?'active':''}" data-mode="source">원본 텍스트</button></div><div class="file-breadcrumb">${path.split('/').map(x=>`<span>${escapeHtml(x)}</span>`).join(' › ')}</div><div id="fileBody"></div></div>`}
function renderMain(){window.__codes={};let p;if(query){p=renderSearch()}else if(current.startsWith('lesson:')){let l=LESSONS.find(x=>x.id===current.slice(7));p=l?renderLesson(l):renderOverview()}else if(current.startsWith('file:')){p=renderFile(current.slice(5))}else p=renderOverview();$('mainContent').innerHTML=p;wireActions($('mainContent'));if(!query&&current.startsWith('file:'))showFile(current.slice(5))}
function wireActions(root){root.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));root.querySelectorAll('[data-domain]').forEach(el=>{el.onclick=()=>{let l=LESSONS.find(l=>l.domain===Number(el.dataset.domain));if(l)go('lesson:'+l.id)};el.onkeydown=e=>{if(e.key==='Enter')el.click()}});root.querySelectorAll('[data-done]').forEach(el=>el.onclick=()=>setDone(el.dataset.done));root.querySelectorAll('[data-copy]').forEach(el=>el.onclick=()=>copyText(window.__codes[el.dataset.copy]));root.querySelectorAll('[data-print]').forEach(el=>el.onclick=()=>window.print());root.querySelectorAll('[data-clear]').forEach(el=>el.onclick=()=>{query='';$('globalSearch').value='';go('overview')});root.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{renderRaw=el.dataset.mode==='source';renderMain()});root.querySelectorAll('[data-filecopy]').forEach(el=>el.onclick=()=>{let s=repoRawCache.get(current.slice(5));if(s)copyText(s);else toast('원문 로딩을 먼저 완료하십시오')});root.querySelectorAll('[data-import]').forEach(el=>el.onclick=()=>$('folderInput').click());root.querySelectorAll('[data-scroll]').forEach(el=>el.onclick=()=>document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth'}))}
function domainForView(view){if(view.startsWith('lesson:'))return LESSONS.find(l=>l.id===view.slice(7))?.domain??null;if(view.startsWith('file:'))return DOMAINS.find(d=>view.slice(5).startsWith(d.dir+'/'))?.id??null;return null}
function go(view){query='';$('globalSearch').value='';current=view;activeDomain=domainForView(view);renderRaw=false;renderMain();renderSidebar();$('sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'instant'});let h=view==='overview'?'#/':view.startsWith('file:')?'#/file/'+encodeURIComponent(view.slice(5)):'#/lesson/'+encodeURIComponent(view.slice(7));if(location.hash!==h)history.replaceState(null,'',h)}
async function syncGithub(manual=false){repoState='loading';repoError='';renderSidebar();if(!query&&current==='overview')renderMain();try{const c=new AbortController(),timer=setTimeout(()=>c.abort(),18000);let res=await fetch(API,{signal:c.signal,headers:{Accept:'application/vnd.github+json'}});clearTimeout(timer);if(!res.ok)throw new Error('GitHub API HTTP '+res.status);let data=await res.json();if(!Array.isArray(data.tree))throw new Error('Git tree 구조 오류');if(data.truncated)throw new Error('GitHub 응답 일부만 수신됨');tree=data.tree.filter(x=>x.type==='blob'&&typeof x.path==='string').map(x=>({path:x.path,type:x.type,size:x.size}));repoState='ready';repoSource='github';if(manual)toast(`GitHub 원본 파일 ${tree.length}개 동기화 완료`)}catch(e){repoState='failed';repoError=e.message;if(manual)toast('GitHub 접근 실패: '+e.message)}renderSidebar();if(query||current==='overview')renderMain()}
async function importLocalFolder(files){const arr=Array.from(files||[]);if(!arr.length)return;repoRawCache=new Map();let index=[];for(const file of arr){let rel=(file.webkitRelativePath||file.name).replace(/\\/g,'/').split('/').slice(1).join('/');if(!rel)rel=file.name;if(rel.split('/').includes('.git'))continue;index.push({path:rel,type:'blob',size:file.size});if(file.size<2000000&&(/\.(md|markdown|ya?ml|txt|sh|json|xml|conf|ini|toml|js|py|tf|Dockerfile|properties|rules)$/i.test(rel)||/Dockerfile$|Makefile$|\.gitignore$/.test(rel))){try{repoRawCache.set(rel,await file.text())}catch(e){}}}if(!index.length){toast('선택한 폴더에서 파일을 찾지 못했습니다');return}tree=index;repoSource='local';repoState='ready';query='';$('globalSearch').value='';toast('로컬 저장소 '+tree.length+'개 파일 불러오기 완료');renderSidebar();renderMain()}
function init(){const hash=decodeURI(location.hash);if(hash.startsWith('#/lesson/')){let id=decodeURIComponent(hash.slice(9));current='lesson:'+id}else if(hash.startsWith('#/file/')){current='file:'+decodeURIComponent(hash.slice(7))}else current='overview';activeDomain=domainForView(current);$('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';$('themeBtn').onclick=setTheme;$('syncBtn').onclick=()=>syncGithub(true);$('importBtn').onclick=()=>$('folderInput').click();$('folderInput').addEventListener('change',e=>importLocalFolder(e.target.files));$('mobileMenu').onclick=()=>$('sidebar').classList.toggle('open');$('globalSearch').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderSidebar();renderMain()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('globalSearch').focus()}if(e.key==='Escape'){$('globalSearch').blur();$('sidebar').classList.remove('open')}});window.addEventListener('hashchange',()=>{let h=decodeURI(location.hash);if(h.startsWith('#/lesson/'))go('lesson:'+decodeURIComponent(h.slice(9)));else if(h.startsWith('#/file/'))go('file:'+decodeURIComponent(h.slice(7)));else if(h==='#/'||h==='#')go('overview')});renderMain();renderSidebar();syncGithub()}
init();
</script>
